<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text-to-Speech Demo</title>
    <style>
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          display: flex;
          flex-direction: column;
          align-items: center;
          min-height: 100vh;
          margin: 0;
          background-color: #f4f4f9;
          padding: 20px;
          box-sizing: border-box;
          font-size: 18px;
        }
        textarea, #textDisplay {
          width: 90%;
          max-width: 600px;
          height: calc(100vh - 300px);
          min-height: 150px;
          margin: 10px 0;
          padding: 15px;
          font-size: 18px;
          border: 1px solid #ccc;
          border-radius: 8px;
          box-sizing: border-box;
          line-height: 1.4;
          resize: none;
        }
        #textDisplay {
          background-color: #fff;
          white-space: pre-wrap;
          overflow-y: auto;
        }
        select, button {
          padding: 15px;
          font-size: 18px;
          margin: 10px 0;
          cursor: pointer;
          width: 90%;
          max-width: 600px;
          border-radius: 8px;
          box-sizing: border-box;
          border: none;
          text-align: center;
        }
        button {
          background-color: #4CAF50;
          color: white;
          font-weight: 500;
          transition: background-color 0.2s;
        }
        button:hover {
          background-color: #45a049;
        }
        #switchToInputMode {
          background-color: #007bff;
        }
        #switchToInputMode:hover {
          background-color: #0056b3;
        }
        .sentence-table {
          width: 100%;
          max-width: 600px;
          border-collapse: collapse;
          margin: 5px 0;
        }
        .sentence-table td {
          vertical-align: top;
          padding: 5px 0;
        }
        .sentence-button {
          width: 40px;
          height: 40px;
          font-size: 20px;
          line-height: 1;
          background-color: #28a745;
          border-radius: 5px;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 0;
          border: none;
          cursor: pointer;
        }
        .sentence-button:hover {
          background-color: #218838;
        }
        .word, .char {
          cursor: pointer;
          padding: 3px 5px;
          border-radius: 5px;
          display: inline-block;
          touch-action: manipulation;
        }
        .word:hover, .char:hover {
          background-color: #e0e0e0;
        }
        .sentence {
          display: block;
          line-height: 1.4;
          margin: 0;
        }
        #inputMode, #readingMode {
          width: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        h1 {
          font-size: 24px;
          margin: 15px 0;
          color: #333;
        }
        @media (max-width: 600px) {
          textarea, #textDisplay {
            width: 95%;
            height: calc(100vh - 280px);
            font-size: 16px;
          }
          h1 {
            font-size: 20px;
          }
          select, button {
            width: 95%;
            font-size: 16px;
          }
          .sentence-button {
            width: 36px;
            height: 36px;
            font-size: 18px;
          }
        }
    </style>
</head>
<body>
<h1>Text-to-Speech Demo</h1>
<div id="inputMode">
    <textarea id="textInput" placeholder="Enter text to speak..."></textarea>
    <button onclick="switchToReadingMode()">Switch to Reading Mode</button>
</div>
<div id="readingMode" style="display: none;">
    <button id="switchToInputMode" onclick="switchToInputMode()">Switch to Input Mode</button>
    <div id="textDisplay"></div>
    <button onclick="readFullText()">Read Full Text</button>
</div>
<select id="voiceSelect">
    <option value="en-GB">UK English</option>
    <option value="zh-CN">Chinese Simplified</option>
</select>

<script>
    const synth = window.speechSynthesis;
    const textInput = document.getElementById('textInput');
    const textDisplay = document.getElementById('textDisplay');
    const voiceSelect = document.getElementById('voiceSelect');
    const inputMode = document.getElementById('inputMode');
    const readingMode = document.getElementById('readingMode');
    let voices = [];
    let sentences = [];

    // Load saved text from localStorage on page load
    window.addEventListener('load', () => {
      const savedText = localStorage.getItem('ttsText');
      if (savedText) {
        textInput.value = savedText;
        // Optionally auto-switch to reading mode if previously in it
        const wasInReadingMode = localStorage.getItem('ttsMode') === 'reading';
        if (wasInReadingMode) {
          switchToReadingMode();
        }
      }
    });

    function populateVoices() {
      voices = synth.getVoices();
      const ukEnglishVoice = voices.find(voice => voice.lang === 'en-GB') || voices.find(voice => voice.lang.startsWith('en'));
      const chineseVoice = voices.find(voice => voice.lang === 'zh-CN') || voices.find(voice => voice.lang.startsWith('zh'));
      voices = [ukEnglishVoice, chineseVoice].filter(Boolean);

      voiceSelect.innerHTML = '';
      voices.forEach((voice, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = index === 0 ? 'UK English' : 'Chinese Simplified';
        voiceSelect.appendChild(option);
      });
    }

    synth.onvoiceschanged = populateVoices;
    populateVoices();

    function switchToReadingMode() {
      const text = textInput.value.trim();
      if (text === '') {
        alert('Please enter some text!');
        return;
      }
      // Save text and mode to localStorage
      localStorage.setItem('ttsText', text);
      localStorage.setItem('ttsMode', 'reading');

      inputMode.style.display = 'none';
      readingMode.style.display = 'flex';
      renderText(text);
    }

    function switchToInputMode() {
      // Save current mode
      localStorage.setItem('ttsMode', 'input');

      readingMode.style.display = 'none';
      inputMode.style.display = 'flex';
      textDisplay.innerHTML = '';
      sentences = [];
    }

    function renderText(text) {
      const isChinese = voiceSelect.options[voiceSelect.selectedIndex].text.includes('Chinese');
      textDisplay.innerHTML = '';
      sentences = text.split(/[,.。！？]/).filter(s => s.trim());

      const table = document.createElement('table');
      table.className = 'sentence-table';

      sentences.forEach((sentence, index) => {
        const row = document.createElement('tr');

        const buttonCell = document.createElement('td');
        const button = document.createElement('button');
        button.className = 'sentence-button';
        button.innerHTML = '▶';
        button.onclick = () => speakText(sentence);
        buttonCell.appendChild(button);
        row.appendChild(buttonCell);

        const sentenceCell = document.createElement('td');
        const sentenceSpan = document.createElement('span');
        sentenceSpan.className = 'sentence';
        if (isChinese) {
          const chars = sentence.split('');
          chars.forEach(char => {
            const charSpan = document.createElement('span');
            charSpan.className = 'char';
            charSpan.textContent = char;
            charSpan.onclick = () => speakText(char);
            sentenceSpan.appendChild(charSpan);
          });
        } else {
          const words = sentence.split(/\s+/).filter(w => w);
          words.forEach(word => {
            const wordSpan = document.createElement('span');
            wordSpan.className = 'word';
            wordSpan.textContent = word + ' ';
            wordSpan.onclick = () => speakText(word);
            sentenceSpan.appendChild(wordSpan);
          });
        }
        sentenceCell.appendChild(sentenceSpan);
        row.appendChild(sentenceCell);
        table.appendChild(row);
      });
      textDisplay.appendChild(table);
    }

    function speakText(text) {
      if (synth.speaking) {
        synth.cancel();
      }
      const utterance = new SpeechSynthesisUtterance(text);
      const selectedVoice = voices[voiceSelect.value];
      utterance.voice = selectedVoice;
      utterance.pitch = 1;
      utterance.rate = 0.8;
      synth.speak(utterance);
    }

    function readFullText() {
      if (readingMode.style.display === 'flex') {
        speakText(textInput.value);
      } else {
        alert('Please switch to reading mode first!');
      }
    }
</script>
</body>
</html>
