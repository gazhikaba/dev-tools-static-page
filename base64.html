<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Base64 / Base64URL Decoder</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { font-family: "Courier New", monospace; padding: 20px; }
        textarea { width: 100%; height: 180px; font-family: "Courier New", monospace; }
        #output { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
        .segment-box { border: 1px solid #888; padding: 8px; margin-bottom: 12px; font-family: "Courier New", monospace; white-space: pre-wrap; }
        .hex { background: #ddd; color: #000; letter-spacing: 1px; }
        .wide-char { display: inline-block; width: 2.5ch; text-align: center; }
        .toggle-area { margin-top: 6px; }
    </style>
</head>
<body>
<h2>Base64 / Base64URL Decoder</h2>

<label>Input:</label>
<textarea id="input"></textarea>

<div>
    <label><input type="checkbox" id="mergeLines"> Merge all lines before decoding</label>
</div>

<div>
    <label>JWT-like delimiter: <input type="text" id="delimiter" value="." size="2"></label>
</div>

<button id="decode">Decode</button>

<h3>Output:</h3>
<div id="output"></div>

<script>
    function normalizeBase64(str) {
        return str.replace(/-/g, '+').replace(/_/g, '/');
    }

    function decodeBase64Segment(seg) {
        var normalized = normalizeBase64(seg);
        while (normalized.length % 4 !== 0) normalized += '=';
        try {
            return atob(normalized);
        } catch (e) {
            return null;
        }
    }

    function renderMixed(str) {
        var out = "";
        for (var i = 0; i < str.length; i++) {
            var c = str.charCodeAt(i);
            if (c >= 32 && c <= 126) {
                out += '<span class="wide-char">' + escapeHtmlChar(str[i]) + '</span>';
            } else {
                out += '<span class="wide-char hex">' + c.toString(16).padStart(2, '0') + '</span>';
            }
        }
        return out;
    }

    function renderAllHex(str) {
        var out = "";
        for (var i = 0; i < str.length; i++) {
            var c = str.charCodeAt(i);
            out += '<span class="wide-char hex">' + c.toString(16).padStart(2, '0') + '</span>';
        }
        return out;
    }

    function escapeHtmlChar(ch) {
        // minimal escaping for < & > to avoid HTML injection
        if (ch === '<') return '&lt;';
        if (ch === '>') return '&gt;';
        if (ch === '&') return '&amp;';
        return ch;
    }

    $(document).on("click", ".hex-toggle", function() {
        var box = $(this).closest('.segment-box');
        var raw = box.data('raw');
        if (this.checked) {
            box.find('.content').html(renderAllHex(raw));
        } else {
            box.find('.content').html(renderMixed(raw));
        }
    });

    $("#decode").on("click", function() {
        var text = $("#input").val() || '';
        var delimiter = $("#delimiter").val();
        var merge = $("#mergeLines").is(":checked");
        var output = $("#output");
        output.empty();

        var segments = [];
        if (!merge) {
            // Split on CRLF or LF
            text.split(/\r?\n/).forEach(function(l) {
                if (delimiter) {
                    // If delimiter is empty string, treat as no split
                    if (delimiter === '') segments.push(l);
                    else segments.push.apply(segments, l.split(delimiter));
                } else {
                    segments.push(l);
                }
            });
        } else {
            var merged = text.replace(/\r?\n/g, "");
            segments = delimiter ? merged.split(delimiter) : [merged];
        }

        segments.forEach((seg, idx) => {
            seg = (seg || '').trim();
            if (!seg) return;

            var decoded = decodeBase64Segment(seg);
            var box = $('<div class="segment-box"></div>');
            box.append('<div><strong>Segment ' + (idx+1) + '</strong></div>');

            if (decoded === null) {
                box.append('<div class="content">Invalid base64/base64url</div>');
            } else {
                box.data('raw', decoded);
                box.append('<div class="content">' + renderMixed(decoded) + '</div>');
                box.append('<div class="toggle-area"><label><input type="checkbox" class="hex-toggle"> Show all as hex</label></div>');
            }

            output.append(box);
        });
    });
</script>
</body>
</html>
